# Asks a host of hueske-digital/infrastructure to deploy a stack's new
# image, through the stack's deploy hook (deploy/README.md), and with
# health-url waits until the stack's page tells the new version. It runs
# on the organization's runners, which serve private repositories; a
# public one passes runner: github. The caller grants nothing.
name: deploy

on:
  workflow_call:
    inputs:
      host:
        description: The wan name of the stack's host, like wan.worksforme.wontfix.xyz (from a repository variable).
        type: string
        required: true
      stack:
        description: The stack's name in the host's list.
        type: string
        required: true
      health-url:
        description: A page of the stack that tells its version; it is asked until it answers health-json.
        type: string
        default: ''
      health-json:
        description: 'The fields health-url must answer with, as a JSON object; "{commit}" stands for the run''s commit.'
        type: string
        default: ''
      health-timeout:
        description: How many seconds health-url is asked before the job fails, 1500 at most.
        type: number
        default: 600
      runner:
        description: self-hosted, the organization's runners, or github, GitHub's, which a public repository takes.
        type: string
        default: self-hosted
    secrets:
      secret:
        description: The stack's deploy secret.
        required: true

permissions: {}

jobs:
  deploy:
    runs-on: ${{ inputs.runner != 'github' && fromJSON('["self-hosted", "buildah"]') || 'ubuntu-26.04' }}
    timeout-minutes: 30
    # One deploy of a stack at a time, in the order of the runs: a second
    # one's health check would wait for a version the first replaced.
    concurrency:
      group: deploy-${{ inputs.host }}-${{ inputs.stack }}
      cancel-in-progress: false
    steps:
      # The action of the commit this workflow is called at, whatever
      # the caller's ref names.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - env:
          RUNNER: ${{ inputs.runner }}
        shell: bash
        run: |
          case $RUNNER in
            self-hosted | github) ;;
            *) echo "::error::runner $RUNNER is none of self-hosted and github"; exit 1 ;;
          esac
      - uses: ./workflows/deploy
        with:
          host: ${{ inputs.host }}
          stack: ${{ inputs.stack }}
          secret: ${{ secrets.secret }}
          health-url: ${{ inputs.health-url }}
          health-json: ${{ inputs.health-json }}
          health-timeout: ${{ inputs.health-timeout }}
