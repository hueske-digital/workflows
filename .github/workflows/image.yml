# Builds a repository's image with Buildah, each architecture on a runner
# of its own, and joins them into one image on ghcr.io:
#   build   one job per architecture, its layers cached in the repository
#           <image>/cache, which only the default branch and tags write;
#           a single architecture is pushed with its tags
#   merge   for two: each was pushed as <image>:sha-<commit>-<arch>, and
#           they become one image with the tags
# A scheduled run builds only when an image of the Dockerfile's FROM lines
# changed since the last build, or that build is older than stale-days.
# It builds on the organization's own runners ([self-hosted, buildah]),
# which serve private repositories; a public one passes runner: github.
# The caller grants contents: read and, to push, packages: write
# (README.md).
name: image

on:
  workflow_call:
    inputs:
      image:
        description: The image without a tag; ghcr.io/<owner>/<repository> in lower case without it.
        type: string
        default: ''
      archs:
        description: A JSON list of amd64 and arm64.
        type: string
        default: '["amd64", "arm64"]'
      context:
        description: The build context, a directory of the repository.
        type: string
        default: .
      file:
        description: The Dockerfile, from the repository's root; Dockerfile of the context without it.
        type: string
        default: ''
      build-args:
        description: One NAME=value a line.
        type: string
        default: ''
      labels:
        description: One name=value a line, besides the source and the revision.
        type: string
        default: ''
      tags:
        description: Tags besides sha-<commit>, one a line; without it latest on the default branch, and the tag's name for a pushed tag.
        type: string
        default: ''
      push:
        description: false builds without pushing, as for a pull request.
        type: boolean
        default: true
      stale-days:
        description: A scheduled run builds when a base image changed or latest is this many days old; 0 builds every run.
        type: number
        default: 30
      runner:
        description: self-hosted, the organization's runners, or github, GitHub's, which a public repository takes.
        type: string
        default: self-hosted
    outputs:
      image:
        description: The image without a tag.
        value: ${{ jobs.build.outputs.image }}
      built:
        description: false for a scheduled run that found nothing to build.
        value: ${{ jobs.build.outputs.built }}
      digest:
        description: The digest of the pushed image (the index of two architectures), empty without push.
        value: ${{ jobs.merge.outputs.digest || jobs.build.outputs.digest }}

jobs:
  build:
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ${{ inputs.runner != 'github' && fromJSON(format('["self-hosted", "buildah", "{0}"]', matrix.arch == 'arm64' && 'ARM64' || 'X64')) || (matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04') }}
    timeout-minutes: 45
    # A matrix job's outputs are one set, the last job's: every
    # architecture writes the same image, tags and built, and digest is
    # that of a single one.
    outputs:
      image: ${{ steps.build.outputs.image }}
      tags: ${{ steps.build.outputs.tags }}
      built: ${{ steps.build.outputs.built }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every input reaches the shell through the environment, never as
      # text of the script.
      - id: build
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          IMAGE: ${{ inputs.image }}
          CONTEXT: ${{ inputs.context }}
          FILE: ${{ inputs.file }}
          BUILD_ARGS: ${{ inputs.build-args }}
          LABELS: ${{ inputs.labels }}
          TAGS: ${{ inputs.tags }}
          PUSH: ${{ inputs.push }}
          RUNNER: ${{ inputs.runner }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SINGLE: ${{ fromJSON(inputs.archs)[1] == null }}
          FIRST_ARCH: ${{ fromJSON(inputs.archs)[0] }}
          STALE_DAYS: ${{ inputs.stale-days }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case $ARCH in
            amd64 | arm64) ;;
            *) echo "::error::arch $ARCH is none of amd64 and arm64"; exit 1 ;;
          esac
          case $RUNNER in
            self-hosted | github) ;;
            *) echo "::error::runner $RUNNER is none of self-hosted and github"; exit 1 ;;
          esac
          # A pull request's GITHUB_SHA is its merge commit.
          sha=${PR_HEAD:-$GITHUB_SHA}
          image=${IMAGE:-ghcr.io/${GITHUB_REPOSITORY,,}}
          if ! [[ $image =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo "::error::image $image is not a lower-case name on ghcr.io without a tag"
            exit 1
          fi
          # The default branch (a scheduled run is one of it) and a tag.
          trusted=''
          if [ "$GITHUB_EVENT_NAME" = schedule ] || { [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; }; then
            trusted=default
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            trusted=tag
          fi
          tags=("sha-${sha::7}")
          if [ -n "$TAGS" ]; then
            while IFS= read -r t; do [ -z "$t" ] || tags+=("$t"); done <<< "$TAGS"
          else
            [ "$trusted" != default ] || tags+=(latest)
            [ "$trusted" != tag ] || tags+=("$GITHUB_REF_NAME")
          fi
          for t in "${tags[@]}"; do
            # An image tag: letters, digits, _ . - and at most 128 of them.
            if ! [[ $t =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::$t is no image tag"
              exit 1
            fi
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"
          file=${FILE:-$CONTEXT/Dockerfile}
          # Also without push: the cache of a private image is read with it.
          printf '%s' "$TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          # One hash over the digest of every image the Dockerfile builds
          # FROM, kept as a label: a scheduled run compares it with the
          # label of latest. A digest is the hash of what the tag names
          # (the index of an image for several platforms). A FROM that
          # names an earlier stage is none, and one with a variable is not
          # known here: such a Dockerfile is built by every run.
          bases=''
          if command -v skopeo > /dev/null; then
            list='' stages=' '
            while read -r ref stage; do
              case "$stages" in *" $ref "*) continue ;; esac
              [ -z "$stage" ] || stages+="$stage "
              [ "$ref" != scratch ] || continue
              case $ref in *'$'*) list=unknown; break ;; esac
              list+="$ref@sha256:$(skopeo inspect --raw "docker://$ref" | sha256sum | cut -d' ' -f1)"$'\n'
            done < <(awk 'toupper($1) == "FROM" { ref = ""; stage = ""; for (i = 2; i <= NF; i++) { if ($i ~ /^--/) continue; if (ref == "") { ref = $i; continue } if (toupper($i) == "AS") { stage = $(i + 1); break } } print ref, stage }' "$file")
            if [ "$list" != unknown ]; then
              printf '%s' "$list"
              bases=$(printf '%s' "$list" | sha256sum | cut -d' ' -f1)
            fi
          else
            echo "::warning::no skopeo on this runner: the base images are not recorded"
          fi
          # Every architecture reads the same one of latest and the same
          # day, so that all of them build or none.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$PUSH" = true ] && [ -n "$bases" ] && [ "$STALE_DAYS" -gt 0 ]; then
            latest=$(skopeo inspect --no-tags --override-os linux --override-arch "$FIRST_ARCH" "docker://$image:latest" 2> /dev/null || echo '{}')
            was=$(jq -r '.Labels["digital.hueske.workflows.bases"] // empty' <<< "$latest")
            age=$(jq -r '(now / 86400 | floor) - ((.Created // "1970-01-01T00:00:00Z") | sub("\\.[0-9]+"; "") | fromdateiso8601 / 86400 | floor)' <<< "$latest")
            if [ "$was" = "$bases" ] && [ "$age" -lt "$STALE_DAYS" ]; then
              echo "The base images are unchanged and latest is $age days old: nothing to build." | tee -a "$GITHUB_STEP_SUMMARY"
              echo "built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "built=true" >> "$GITHUB_OUTPUT"
          # The docker format: Buildah's default, oci, drops a Dockerfile's
          # HEALTHCHECK and runs no RUN with its SHELL. The cache is read
          # by every build and written by those of the default branch and
          # of tags only: a step in it is used by every later build.
          args=(--format docker --layers --platform "linux/$ARCH" --file "$file" --cache-from "$image/cache"
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --label "org.opencontainers.image.revision=$sha")
          while IFS= read -r line; do [ -z "$line" ] || args+=(--build-arg "$line"); done <<< "$BUILD_ARGS"
          while IFS= read -r line; do [ -z "$line" ] || args+=(--label "$line"); done <<< "$LABELS"
          [ -z "$bases" ] || args+=(--label "digital.hueske.workflows.bases=$bases")
          if [ "$PUSH" = true ] && [ -n "$trusted" ]; then
            args+=(--cache-to "$image/cache")
          fi
          buildah build "${args[@]}" --tag "$image:build" "$CONTEXT"
          [ "$PUSH" = true ] || exit 0
          if [ "$SINGLE" = true ]; then
            for t in "${tags[@]}"; do
              buildah push --digestfile "$RUNNER_TEMP/digest" "$image:build" "docker://$image:$t"
            done
            echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
            echo "$image@$(cat "$RUNNER_TEMP/digest") as ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            buildah push "$image:build" "docker://$image:${tags[0]}-$ARCH"
          fi

  merge:
    if: inputs.push && fromJSON(inputs.archs)[1] != null && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ${{ inputs.runner != 'github' && fromJSON('["self-hosted", "buildah"]') || 'ubuntu-26.04' }}
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - id: merge
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAGS: ${{ needs.build.outputs.tags }}
          ARCHS: ${{ inputs.archs }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          # What each build pushed for this commit, read from the registry:
          # one that is missing fails here.
          buildah manifest create merged
          for arch in $(jq -r '.[]' <<< "$ARCHS"); do
            buildah manifest add merged "docker://$IMAGE:${TAGS%% *}-$arch"
          done
          for t in $TAGS; do
            buildah manifest push --all --digestfile "$RUNNER_TEMP/digest" merged "docker://$IMAGE:$t"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$(cat "$RUNNER_TEMP/digest") as $TAGS" >> "$GITHUB_STEP_SUMMARY"
