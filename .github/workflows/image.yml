# Builds a repository's image with Buildah, each architecture on a runner
# of its own, and joins them into one image on ghcr.io:
#   build   one job per architecture, its layers cached in the repository
#           <image>/cache, which only the default branch and tags write;
#           a single architecture is pushed with its tags
#   merge   for two: each was pushed as <image>:sha-<commit>-<arch>, and
#           they become one image with the tags
# With prepare the runner builds first, with Node and pnpm, and what it
# built takes the place of stages of the Dockerfile (build-contexts): the
# build of an application runs once, with the runner's caches, and the
# Dockerfile still builds alone.
# A scheduled run builds only when an image of the Dockerfile's FROM lines
# changed since the last build, or that build is older than stale-days.
# It builds on the organization's own runners ([self-hosted, buildah]),
# which serve private repositories; a public one passes runner: github.
# The caller grants contents: read and, to push, packages: write
# (README.md).
name: image

on:
  workflow_call:
    inputs:
      image:
        description: The image without a tag; ghcr.io/<owner>/<repository> in lower case without it.
        type: string
        default: ''
      archs:
        description: A JSON list of amd64 and arm64.
        type: string
        default: '["amd64", "arm64"]'
      context:
        description: The build context, a directory of the repository.
        type: string
        default: .
      file:
        description: The Dockerfile, from the repository's root; Dockerfile of the context without it.
        type: string
        default: ''
      build-args:
        description: One NAME=value a line.
        type: string
        default: ''
      labels:
        description: One name=value a line, besides the source and the revision.
        type: string
        default: ''
      tags:
        description: Tags besides sha-<commit>, one a line; without it latest on the default branch, and the tag's name for a pushed tag.
        type: string
        default: ''
      prepare:
        description: Commands the runner runs before the image is built, a script of bash, with Node and pnpm as the project names them and the build secrets in its environment; VERSION is the version.
        type: string
        default: ''
      node-directory:
        description: With prepare, the directory of the project's package.json and lockfile.
        type: string
        default: .
      node-version-file:
        description: With prepare, the file that names the Node version, in that directory.
        type: string
        default: .nvmrc
      build-contexts:
        description: One name=directory a line; the directory takes the place of the Dockerfile's stage of that name, which is then not built.
        type: string
        default: ''
      pnpm-store:
        description: With prepare, a path in the build at which every RUN finds the runner's pnpm store, so that an install there downloads little.
        type: string
        default: ''
      latest:
        description: branch, where latest is the default branch, or release, where it is the newest pushed version tag and the default branch has its own name as its tag.
        type: string
        default: branch
      push:
        description: false builds without pushing, as for a pull request.
        type: boolean
        default: true
      stale-days:
        description: A scheduled run builds when a base image changed or latest is this many days old; 0 builds every run.
        type: number
        default: 30
      runner:
        description: self-hosted, the organization's runners, or github, GitHub's, which a public repository takes.
        type: string
        default: self-hosted
    secrets:
      build-secrets:
        description: Secrets of the build, ID=value a line; a RUN of the Dockerfile reads one from /run/secrets/ID with --mount=type=secret,id=ID.
        required: false
    outputs:
      image:
        description: The image without a tag.
        value: ${{ jobs.build.outputs.image }}
      version:
        description: A pushed version tag without its v, else the tag, pr-<number> or the branch.
        value: ${{ jobs.build.outputs.version }}
      built:
        description: false for a scheduled run that found nothing to build.
        value: ${{ jobs.build.outputs.built }}
      digest:
        description: The digest of the pushed image (the index of two architectures), empty without push.
        value: ${{ jobs.merge.outputs.digest || jobs.build.outputs.digest }}

jobs:
  build:
    strategy:
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    runs-on: ${{ inputs.runner != 'github' && fromJSON(format('["self-hosted", "buildah", "{0}"]', matrix.arch == 'arm64' && 'ARM64' || 'X64')) || (matrix.arch == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04') }}
    timeout-minutes: 45
    # A matrix job's outputs are one set, the last job's: every
    # architecture writes the same image, tags and built, and digest is
    # that of a single one.
    outputs:
      image: ${{ steps.due.outputs.image }}
      tags: ${{ steps.due.outputs.tags }}
      version: ${{ steps.due.outputs.version }}
      built: ${{ steps.due.outputs.built }}
      digest: ${{ steps.build.outputs.digest }}
    # Every input reaches a script through the environment, never as text
    # of it.
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: ${{ inputs.image }}
      CONTEXT: ${{ inputs.context }}
      FILE: ${{ inputs.file }}
      BUILD_ARGS: ${{ inputs.build-args }}
      LABELS: ${{ inputs.labels }}
      TAGS: ${{ inputs.tags }}
      LATEST: ${{ inputs.latest }}
      PUSH: ${{ inputs.push }}
      RUNNER: ${{ inputs.runner }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      SINGLE: ${{ fromJSON(inputs.archs)[1] == null }}
      FIRST_ARCH: ${{ fromJSON(inputs.archs)[0] }}
      STALE_DAYS: ${{ inputs.stale-days }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # scripts/build.sh of the commit this workflow is called at.
      - env:
          SCRIPT: https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/scripts/build.sh
        run: curl --fail --silent --show-error --location --retry 3 --max-time 30 --output "$RUNNER_TEMP/build.sh" "$SCRIPT"
      # Whether this run builds (a scheduled one may have nothing to do),
      # and its image, tags and version.
      - id: due
        shell: bash
        env:
          CHECK_ONLY: true
        run: bash "$RUNNER_TEMP/build.sh"
      - if: inputs.prepare != '' && steps.due.outputs.built == 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ inputs.node-directory }}/package.json
      - if: inputs.prepare != '' && steps.due.outputs.built == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.node-directory }}/${{ inputs.node-version-file }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.node-directory }}/pnpm-lock.yaml
      # The caller's own commands, as a run step of its workflow would be:
      # they reach bash as a file. A build secret is in their environment
      # under its ID, where that is a name a shell takes.
      - if: inputs.prepare != '' && steps.due.outputs.built == 'true'
        shell: bash
        env:
          PREPARE: ${{ inputs.prepare }}
          VERSION: ${{ steps.due.outputs.version }}
          BUILD_SECRETS: ${{ secrets.build-secrets }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            id=${line%%=*} value=${line#*=}
            if [[ $line == *=* ]] && [[ $id =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] && [ -n "$value" ]; then
              echo "::add-mask::$value"
              export "$id=$value"
            fi
          done <<< "$BUILD_SECRETS"
          unset BUILD_SECRETS line id value
          printf '%s\n' "$PREPARE" > "$RUNNER_TEMP/prepare.sh"
          bash -euo pipefail "$RUNNER_TEMP/prepare.sh"
      - id: build
        if: steps.due.outputs.built == 'true'
        shell: bash
        env:
          BUILD_SECRETS: ${{ secrets.build-secrets }}
          BUILD_CONTEXTS: ${{ inputs.build-contexts }}
          PNPM_STORE: ${{ inputs.prepare != '' && inputs.pnpm-store || '' }}
        run: |
          set -euo pipefail
          if [ -n "$PNPM_STORE" ]; then
            [[ $PNPM_STORE =~ ^(/[A-Za-z0-9_.-]+)+$ ]] || { echo "::error::pnpm-store $PNPM_STORE is no absolute path"; exit 1; }
            BUILD_VOLUMES="$(pnpm store path):$PNPM_STORE"
            export BUILD_VOLUMES
          fi
          bash "$RUNNER_TEMP/build.sh"

  merge:
    if: inputs.push && fromJSON(inputs.archs)[1] != null && needs.build.outputs.built == 'true'
    needs: build
    runs-on: ${{ inputs.runner != 'github' && fromJSON('["self-hosted", "buildah"]') || 'ubuntu-26.04' }}
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - id: merge
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAGS: ${{ needs.build.outputs.tags }}
          ARCHS: ${{ inputs.archs }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | buildah login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          # What each build pushed for this commit, read from the registry:
          # one that is missing fails here.
          buildah manifest create merged
          for arch in $(jq -r '.[]' <<< "$ARCHS"); do
            buildah manifest add merged "docker://$IMAGE:${TAGS%% *}-$arch"
          done
          for t in $TAGS; do
            buildah manifest push --all --digestfile "$RUNNER_TEMP/digest" merged "docker://$IMAGE:$t"
          done
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$(cat "$RUNNER_TEMP/digest") as $TAGS" >> "$GITHUB_STEP_SUMMARY"
