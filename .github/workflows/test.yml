name: test

# Builds test/ with image.yml on GitHub's runners and runs the result on
# both architectures, runs the deploy action against a real webhook, and
# checks when a scheduled run builds (test/stale.sh), and builds test/site
# with astro.yml, whose image must hold the dist/ of the runner. This repository is public: the organization's own
# runners serve private repositories only, where image.yml takes them.
on:
  push:
    branches: [main]
  pull_request:
  # A scheduled run finds nothing to build while the base image is the
  # same and latest is young.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/hueske-digital/workflows/test
      context: test
      build-args: GREETING=built-{version}
      runner: github
      # A pull request builds only.
      push: ${{ github.event_name != 'pull_request' }}
    secrets:
      build-secrets: |
        PROOF=workflows-${{ github.run_id }}
        UNUSED=

  run:
    if: needs.image.outputs.built == 'true' && needs.image.outputs.digest != ''
    needs: image
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - shell: bash
        env:
          IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          version=${GITHUB_REF_NAME//\//-}
          [ "$(podman run --rm "$IMAGE")" = "built-$version" ]
          [ "$(podman run --rm "$IMAGE" cat /proof-length)" -gt 10 ]

  site:
    uses: ./.github/workflows/astro.yml
    permissions:
      contents: read
      packages: write
    with:
      directory: test/site
      image: ghcr.io/hueske-digital/workflows/test-site
      arch: amd64
      checks-after: after
      push: ${{ github.event_name != 'pull_request' }}
      runner: github

  site-run:
    if: needs.site.outputs.built == 'true' && needs.site.outputs.digest != ''
    needs: site
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - shell: bash
        env:
          IMAGE: ${{ needs.site.outputs.image }}@${{ needs.site.outputs.digest }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          [ "$(podman run --rm "$IMAGE")" = "the runner true" ]

  node:
    uses: ./.github/workflows/node.yml
    permissions:
      contents: read
    with:
      directory: test/site
      run: |
        pnpm lint
        pnpm build
        test -f dist/index.html
      runner: github

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh test/*.sh deploy/test/*.sh
      # With the runner labels of .github/actionlint.yaml, and without
      # the job context's workflow_sha, which this actionlint does not know.
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo docker.io/rhysd/actionlint:1.7.7 -color

  # The runner builds first: what it left takes the place of the
  # Dockerfile's stage, and its pnpm store is in the build.
  prepared:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/hueske-digital/workflows/test-prepared
      archs: '["amd64"]'
      context: test/prepared
      node-directory: test/site
      prepare: |
        cd test/site
        pnpm install --frozen-lockfile
        mkdir -p ../prepared/stage/out
        echo "the runner $VERSION $(node --version | cut -c1-3) ${PROOF:+with-secret}" > ../prepared/stage/out/built-by
      build-contexts: build=test/prepared/stage
      pnpm-store: /pnpm/store
      push: ${{ github.event_name != 'pull_request' }}
      runner: github
    secrets:
      build-secrets: PROOF=workflows-${{ github.run_id }}

  prepared-run:
    if: needs.prepared.outputs.built == 'true' && needs.prepared.outputs.digest != ''
    needs: prepared
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - shell: bash
        env:
          IMAGE: ${{ needs.prepared.outputs.image }}@${{ needs.prepared.outputs.digest }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          got=$(podman run --rm "$IMAGE")
          echo "$got"
          [ "$got" = "the runner ${GITHUB_REF_NAME//\//-} v24 with-secret"$'\n'"store" ]

  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: deploy/test/run.sh

  stale:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: test/stale.sh
