name: test

# Builds test/ with image.yml on GitHub's runners and runs the result on
# both architectures, runs the deploy action against a real webhook, and
# checks when a scheduled run builds (test/stale.sh). This repository is public: the organization's own
# runners serve private repositories only, where image.yml takes them.
on:
  push:
    branches: [main]
  pull_request:
  # A scheduled run finds nothing to build while the base image is the
  # same and latest is young.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ghcr.io/hueske-digital/workflows/test
      context: test
      build-args: GREETING=built
      runner: github
      # A pull request builds only.
      push: ${{ github.event_name != 'pull_request' }}

  run:
    if: needs.image.outputs.built == 'true' && needs.image.outputs.digest != ''
    needs: image
    strategy:
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    permissions:
      packages: read
    steps:
      - shell: bash
        env:
          IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | podman login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          [ "$(podman run --rm "$IMAGE")" = built ]

  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: deploy/test/run.sh

  stale:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test/stale.sh

  # deploy.yml itself, up to the action's check of its inputs: a mistake
  # there fails before any hook is called.
  deploy-workflow:
    uses: ./.github/workflows/deploy.yml
    with:
      host: localhost
      stack: demo
      health-url: https://example.invalid/health
      health-json: not json
      runner: github
    secrets:
      secret: 0123456789abcdef0123456789abcdef

  deploy-workflow-refused:
    if: always()
    needs: deploy-workflow
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.deploy-workflow.result }}
        run: '[ "$RESULT" = failure ]'
